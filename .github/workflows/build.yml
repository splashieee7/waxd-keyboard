name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build foss release
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        if: env.SIGNING_STORE_BASE64 != ''
        run: |
          echo "$SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build
        run: |
          if [ -z "${SIGNING_STORE_FILE:-}" ]; then
            echo "No signing secrets: building UNSIGNED apk"
            unset SIGNING_STORE_FILE SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleFossRelease

      - name: Rename artifact
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -n1)
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          OUT="waxd-keyboard-${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: waxd-keyboard-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
